<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--g:#14532d;--g2:#166534;--gl:#dcfce7;--amber:#b45309;--al:#fef3c7;--red:#b91c1c;--rl:#fee2e2;--ink:#1c1917;--mut:#78716c;--line:#e7e5e4;--bg:#fafaf9;--card:#fff;--r:14px}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:6px 12px;font-size:13px}
main{max-width:860px;margin:0 auto;padding:14px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button.on{color:var(--g);font-weight:600}.tabs svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:0 0 8px}
.mic{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px}
.micbtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(20,83,45,.3)}
.micbtn svg{width:36px;height:36px}.micbtn.live{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(185,28,28,.45)}100%{box-shadow:0 0 0 22px rgba(185,28,28,0)}}
.hint{color:var(--mut);font-size:13px;text-align:center}
textarea,input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid #d6d3d1;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .full{grid-column:1/-1}
.btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;background:var(--g);color:#fff}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.btn.sec{background:#f5f5f4;color:var(--ink)}.btn.warn{background:var(--rl);color:var(--red)}.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.5}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.search{display:flex;gap:8px;position:sticky;top:56px;z-index:10;background:var(--bg);padding:6px 0 8px}
.search input{flex:1}.iconbtn{width:44px;flex:none;border:0;border-radius:10px;background:var(--g);color:#fff;display:grid;place-items:center}
.iconbtn.live{background:var(--red)}.iconbtn svg{width:20px;height:20px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--mut)}
.list{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:640px){.list{grid-template-columns:1fr 1fr}}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.item .ph{aspect-ratio:16/9;background:#e7e5e4 center/cover no-repeat;display:grid;place-items:center;color:#a8a29e;font-size:12px}
.item .bd{padding:11px 12px}.price{font-size:18px;font-weight:700}.price small{font-weight:500;color:var(--mut);font-size:12px}
.meta{color:var(--mut);font-size:13px}.ttl{font-weight:600;margin:2px 0}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;margin-right:4px;background:#f5f5f4;color:var(--ink)}
.tag.available{background:var(--gl);color:var(--g)}.tag.negotiating{background:var(--al);color:var(--amber)}
.tag.sold,.tag.rented{background:var(--rl);color:var(--red)}.tag.on_hold{background:#e0e7ff;color:#3730a3}.tag.match{background:#ecfccb;color:#3f6212}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.photos{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.photos img{height:120px;border-radius:10px;flex:none}
.photos .x{position:relative;flex:none}.photos .x button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c1917;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}.understood{background:var(--gl);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--g);margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv dt{color:var(--mut)}.kv dd{margin:0}
.hide{display:none!important}a{color:var(--g2)}
.score{display:inline-grid;place-items:center;min-width:44px;height:26px;border-radius:999px;font-size:12px;font-weight:700;background:var(--gl);color:var(--g);padding:0 8px}
.score.mid{background:var(--al);color:var(--amber)}
.mrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.mrow:first-child{border-top:0}
.typechips{display:flex;flex-wrap:wrap;gap:6px}.typechips label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--ink);margin:0;background:#fff}
.typechips input{width:auto;margin:0}
.lead{cursor:pointer}.hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:12px;min-height:190px;display:flex;align-items:flex-end;background:#14532d center/cover no-repeat;color:#fff}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.75))}
.hero .in{position:relative;z-index:1;padding:16px}.hero b{font-size:20px;display:block}.hero span{font-size:13px;opacity:.9}
.ph .rep{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 6px;border-radius:5px}
.item .ph{position:relative}
.amen{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.amen span{font-size:12px;background:#f5f5f4;border-radius:999px;padding:3px 9px}
.pricehint{font-size:12px;color:var(--g);margin-top:3px;min-height:16px}
.private{border-left:3px solid var(--amber);padding-left:10px}
</style>
</head>
<body>
<header><h1 id="brand">Mangalore Property Inventory</h1><button id="authBtn">Team login</button></header>

  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Team</button>
</nav>

<script>
// ---- Natural-language parser for Mangalore listings & searches ----
const MANGALORE_LOCALITIES = ["Attavar","Bajpe","Ballalbagh","Bejai","Bendoor","Bendoorwell","Bikarnakatte","Bijai","Bolar","Bondel","Car Street","Chilimbi","Deralakatte","Derebail","Falnir","Gorigudda","Hampankatta","Jeppu","Jeppinamogaru","Kadri","Kadri Hills","Kankanady","Kapikad","Karangalpady","Kavoor","Kodialbail","Kodialguthu","Kodical","Konchady","Kottara","Kottara Chowki","Kulai","Kulshekar","Kuloor","Lady Hill","Lalbagh","Mallikatte","Mannagudda","Marnamikatte","Maryhill","Morgans Gate","Mulki","Nanthoor","Neermarga","Padil","Pandeshwar","Panambur","Pumpwell","Shakthinagar","Shivbagh","Surathkal","Thokottu","Ullal","Urwa","Urwa Store","Valencia","Vamanjoor","Yeyyadi","Kottara Cross","Baikampady","Kunjathbail","Ashok Nagar","Dongerkery","Hat Hill","Kadri Kambla","Kankanady Bypass","Bunts Hostel","Sasihithlu","Kuntikana","Kapikad","Pachanady","Alape","Kannur","Adyar","Farangipete","Thumbe","Bantwal","Moodbidri","Mulky"];

const NUM_WORDS = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,fifteen:15,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100,single:1,double:2};

function normalizeText(s) {
  let t = " " + String(s || "").toLowerCase().replace(/[₹]/g, " rs ").replace(/\s+/g, " ") + " ";
  t = t.replace(/(\d),(?=\d)/g, "$1");                 // 1,200 -> 1200
  t = t.replace(/\b(\d+)\s*(?:and a half|\.5)\b/g, "$1.5");
  // "fifty five" -> 55, "two" -> 2
  t = t.replace(/\b(twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)[\s-](one|two|three|four|five|six|seven|eight|nine)\b/g, (m, a, b) => String(NUM_WORDS[a] + NUM_WORDS[b]));
  t = t.replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fifteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|single|double)\b(?!\s*(?:storey|story))/g, m => String(NUM_WORDS[m]));
  t = t.replace(/\b(\d+)\s+point\s+(\d+)\b/g, "$1.$2");
  t = t.replace(/\b(\d+(?:\.\d+)?)\s*(?:crores?|cr)\s*(?:and\s*)?(\d{1,2})\s*(?:lakhs?|lacs?|lakh|lac|l)\b/g, (m, c, l) => (parseFloat(c) + parseInt(l) / 100) + " crore");
  t = t.replace(/\b(\d)\s*b\s*h\s*k\b/g, "$1bhk").replace(/\b(\d)\s*(?:bhk|bed ?rooms?|beds?|bedroom flat)\b/g, "$1 bhk");
  return t;
}

const UNIT_RE = "(crores?|cr|lakhs?|lacs?|lakh|lac|l|k|thousands?|rs|rupees)?";
function toRupees(n, unit, deal) {
  n = parseFloat(n); if (isNaN(n)) return null;
  unit = (unit || "").trim();
  if (/^cr/.test(unit)) return Math.round(n * 1e7);
  if (/^(lakh|lac|l)/.test(unit)) return Math.round(n * 1e5);
  if (/^(k|thousand)/.test(unit)) return Math.round(n * 1e3);
  if (n >= 10000) return Math.round(n);
  if (deal === "rent") return Math.round(n * 1000);   // "rent 25" -> 25,000
  return Math.round(n * 1e5);                          // "asking 55" -> 55 lakh
}

function fuzzyNorm(s) { return String(s || "").toLowerCase().replace(/[^a-z]/g, "").replace(/ck/g, "k").replace(/c(?=[aou]|$)/g, "k").replace(/sh/g, "s").replace(/th/g, "t").replace(/dh/g, "d").replace(/gh/g, "g").replace(/q/g, "k").replace(/ph/g, "f").replace(/v/g, "b").replace(/w/g, "b").replace(/(.)\1+/g, "$1").replace(/[aeiouy]+/g, "a"); }
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
// Returns the best known locality for a phrase, or null.
function snapLocality(phrase, known) {
  const p = fuzzyNorm(phrase); if (p.length < 3) return null;
  let best = null, bestScore = 99;
  for (const k of known) {
    const q = fuzzyNorm(k);
    if (q === p) return k;
    if (q[0] !== p[0]) continue;
    const d = lev(p, q);
    const tol = q.length <= 5 ? 1 : q.length <= 8 ? 2 : 3;
    if (d <= tol && d < bestScore) { best = k; bestScore = d; }
  }
  return best;
}
function findLocalityInTextUnused(t, known) {
  const words = t.replace(/[^a-z ]/g, " ").split(/\s+/).filter(Boolean);
  // try 2-word then 1-word windows
  let found = null;
  for (const size of [3, 2, 1]) {
    for (let i = 0; i + size <= words.length; i++) {
      const w = words.slice(i, i + size).join(" ");
      if (w.length < 4) continue;
      if (STOP.has(words[i]) || STOP.has(words[i + size - 1])) continue;
      const hit = snapLocality(w, known);
      if (hit) { found = hit; return found; }
    }
  }
  return found;
}
const STOP = new Set("a an the in at for sale rent bhk flat apartment asking price close will is of and to size square feet sqft sq ft with near on up floor facing owner name number phone lakh lakhs crore cr budget under below above me find show any need want looking client house villa plot land shop office commercial furnished semi unfurnished available sold also it its this that per month deposit between from or around about above below over within upto than more less rate good nice new old ready move".split(" "));

function titleCase(s) { return String(s).replace(/\b[a-z]/g, c => c.toUpperCase()).trim(); }

function detectDeal(t) { return /\b(rent|rental|lease|to let|tenant|per month|monthly)\b/.test(t) ? "rent" : (/\b(sale|sell|selling|buy|resale|purchase)\b/.test(t) ? "sale" : null); }
function detectType(t) {
  if (/\bplots?\b|\bsite\b|\bcents?\b|\bsq(?:uare)? ?yards?\b/.test(t)) return "plot";
  if (/\bland\b|\bacres?\b|\bagri/.test(t)) return "land";
  if (/\bshops?\b|\bshowroom\b/.test(t)) return "shop";
  if (/\boffice\b/.test(t)) return "office";
  if (/\bcommercial\b|\bwarehouse\b|\bgodown\b/.test(t)) return "commercial";
  if (/\bvilla\b|\brow house\b/.test(t)) return "villa";
  if (/\bindependent house\b|\bbungalow\b|\bindividual house\b|\bhouse\b/.test(t) && !/\bflat\b|\bapartment\b/.test(t)) return "independent_house";
  if (/\bflat\b|\bapartment\b|\bbhk\b|\brk\b/.test(t)) return "apartment";
  return null;
}
function detectBhk(t) {
  let m = t.match(/\b(\d(?:\.5)?) bhk\b/); if (m) return parseFloat(m[1]);
  if (/\b1 ?rk\b/.test(t)) return 1;
  return null;
}
function detectSize(t) {
  let m = t.match(/\b(\d+(?:\.\d+)?)\s*(?:sq\.? ?ft|sqft|sft|square (?:feet|foot|fit)|sq feet|feet|ft)\b/);
  if (m) return Math.round(parseFloat(m[1]));
  m = t.match(/\b(\d+(?:\.\d+)?)\s*(?:sq\.? ?yards?|square yards?|gaj)\b/); if (m) return Math.round(parseFloat(m[1]) * 9);
  m = t.match(/\b(\d+(?:\.\d+)?)\s*cents?\b/); if (m) return Math.round(parseFloat(m[1]) * 435.6);
  m = t.match(/\b(\d+(?:\.\d+)?)\s*acres?\b/); if (m) return Math.round(parseFloat(m[1]) * 43560);
  m = t.match(/\b(?:size|area|carpet|built ?up|super built ?up)\s*(?:is|of|area)?\s*(\d{3,5})\b/); if (m) return parseInt(m[1]);
  return null;
}
function detectFloor(t) {
  if (/\bground floor\b/.test(t)) return "Ground";
  const m = t.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s*floor\b/); if (m) return m[1];
  if (/\btop floor\b/.test(t)) return "Top";
  return null;
}
function detectFacing(t) {
  const m = t.match(/\b(north|south|east|west)(?:[\s-]?(east|west))?\s*facing\b/);
  return m ? titleCase(m[1] + (m[2] ? "-" + m[2] : "")) : null;
}
function detectFurnishing(t) {
  if (/\bsemi[\s-]?furnished\b/.test(t)) return "semi-furnished";
  if (/\bun[\s-]?furnished\b|\bnot furnished\b/.test(t)) return "unfurnished";
  if (/\b(fully )?furnished\b/.test(t)) return "furnished";
  return null;
}
function detectPhone(raw) {
  const digits = String(raw || "").replace(/(\d)[\s-]+(?=\d)/g, "$1");
  const m = digits.match(/(?:\+?91)?([6-9]\d{9})\b/);
  return m ? m[1] : null;
}
function detectOwner(t) {
  const m = t.match(/\b(?:owner|landlord|seller|contact)(?:'s| is| name is| name|:)*\s+(?:mr\.? |mrs\.? |ms\.? )?([a-z]+(?: [a-z]+)?)/);
  if (!m) return null;
  const words = m[1].split(" ").filter(w => !STOP.has(w) && !/^\d/.test(w) && w !== "number" && w !== "phone");
  return words.length ? titleCase(words.join(" ")) : null;
}
function detectStatus(t) {
  if (/\b(already )?(sold out|sold)\b/.test(t)) return "sold";
  if (/\b(already rented|rented out)\b/.test(t)) return "rented";
  if (/\bnegotiat|\btoken\b|\badvance paid\b/.test(t)) return "negotiating";
  if (/\bon hold\b/.test(t)) return "on_hold";
  return null;
}
function detectBuilding(t) {
  const m = t.match(/\b(?:building|society|project|complex) (?:name )?(?:is |called )?([a-z][a-z0-9 ]{1,30}?)(?= in | at | near |,|\.| asking| price| for | size| \d| owner|  |$)/);
  if (m && !STOP.has(m[1].trim())) return titleCase(m[1]);
  const m2 = t.match(/\b([a-z]+(?: [a-z]+)?) (residency|enclave|heights|towers|apartments|arcade|palms|gardens|court|nest|homes|castle|plaza)\b/);
  if (m2 && !STOP.has(m2[1].split(" ")[0])) return titleCase(m2[1] + " " + m2[2]);
  return null;
}


// ---- Extra listing details ----
const AMENITIES = { lift: "Lift", parking: "Car parking", power_backup: "Power backup", security: "Security", cctv: "CCTV", gym: "Gym", pool: "Swimming pool", garden: "Garden", clubhouse: "Clubhouse", play_area: "Kids play area", intercom: "Intercom", water: "24h water", gas: "Piped gas", sea_view: "Sea view" };
const APPROVALS = { rera: "RERA", a_khata: "A Khata", b_khata: "B Khata", e_khata: "E Khata", oc: "OC", cc: "CC", dc: "DC converted", nine_eleven: "9/11" };
function detectAmenities(t) {
  const out = []; const add = k => { if (!out.includes(k)) out.push(k); };
  if (/\blifts?\b|\belevators?\b/.test(t)) add("lift");
  if (/\bparking\b|\bcar park\b|\bgarage\b/.test(t)) add("parking");
  if (/\bpower ?back ?up\b|\bgenerator\b|\bdg ?back ?up\b|\binverter\b/.test(t)) add("power_backup");
  if (/\bsecurity\b|\bwatchman\b|\bgated\b/.test(t)) add("security");
  if (/\bcctv\b|\bcamera\b/.test(t)) add("cctv");
  if (/\bgym\b|\bfitness\b/.test(t)) add("gym");
  if (/\b(swimming )?pool\b/.test(t)) add("pool");
  if (/\bgarden\b|\blawn\b/.test(t)) add("garden");
  if (/\bclub ?house\b/.test(t)) add("clubhouse");
  if (/\bplay ?(area|ground)\b|\bkids\b/.test(t)) add("play_area");
  if (/\bintercom\b/.test(t)) add("intercom");

// ---------- Speech ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen(btn, onText, { continuous = true } = {}) {
  if (!SR) { toast("Voice not supported in this browser — tap the keyboard mic instead"); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = "en-IN"; rec.interimResults = true; rec.continuous = continuous;
  let finalText = "";
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i]; if (r.isFinal) finalText += r[0].transcript + " "; else interim += r[0].transcript;
    }
    onText((finalText + interim).trim(), false);
  };
  rec.onerror = e => { if (e.error === "not-allowed") toast("Allow microphone access to use voice"); };
  rec.onend = () => { btn.classList.remove("live"); rec = null; onText(finalText.trim(), true); };
  btn.classList.add("live"); rec.start();
}

// ---------- AI parsing (optional, falls back to on-device parser) ----------
async function smartParse(text, mode) {
  const known = knownLocalities();
  if (S.ai !== false && S.session) {
    try {
      const { data, error } = await sb.functions.invoke("parse-listing", { body: { text, mode, localities: known } });
      if (!error && data && !data.error) { S.ai = true; return { ...localParse(text, mode, known), ...clean(data) }; }
      if (error && /501|no_key/.test(String(error.message || "") + String(error.context?.status || ""))) S.ai = false;
    } catch (e) { S.ai = false; }
  }
  return localParse(text, mode, known);
}
function localParse(text, mode, known) { return mode === "search" ? parseSearch(text, known) : mode === "lead" ? parseLead(text, known) : parseListing(text, known); }
function clean(o) { const r = {}; for (const k in o) if (o[k] !== null && o[k] !== "" && !(Array.isArray(o[k]) && !o[k].length)) r[k] = o[k]; return r; }

// ---------- Search ----------
function sameLoc(a, b) { if (!a || !b) return false; return fuzzyNorm(a) === fuzzyNorm(b) || snapLocality(a, [b]) === b; }
function applySearch(rows, q, text, team) {
  const hasStructured = q && (q.deal_type || q.property_type || q.bhk || q.localities?.length || q.min_price || q.max_price || q.min_size || q.max_size || q.furnishing);
  const out = [];
  for (const l of rows) {
    if (S.filters.deal && l.deal_type !== S.filters.deal) continue;
    if (S.filters.type && l.property_type !== S.filters.type) continue;
    if (team) {
      if (S.filters.status === "active" && !["available", "negotiating", "on_hold"].includes(l.status)) continue;
      if (S.filters.status && S.filters.status !== "active" && S.filters.status !== "all" && l.status !== S.filters.status) continue;
    }
    let badge = null;
    if (text && hasStructured) {
      if (q.deal_type && l.deal_type !== q.deal_type) continue;
      if (q.property_type && l.property_type !== q.property_type && !(q.property_type === "plot" && l.property_type === "land")) continue;
      if (q.bhk && +l.bhk !== +q.bhk) continue;
      if (q.localities?.length && !q.localities.some(x => sameLoc(l.locality, x))) continue;
      if (q.furnishing && l.furnishing !== q.furnishing) continue;
      if (q.min_size && !(l.size_sqft >= q.min_size * 0.95)) continue;
      if (q.max_size && !(l.size_sqft <= q.max_size * 1.05)) continue;
      const ask = +l.asking_price || null, close = team ? (+l.closing_price || ask) : ask;
      if (q.max_price) {
        if (!close) continue;
        if (ask && ask <= q.max_price) badge = "Within budget";
        else if (close <= q.max_price) badge = "Can close within budget";
        else if (close <= q.max_price * 1.1) badge = "Slightly above budget";
        else continue;
      }
      if (q.min_price && !(ask >= q.min_price * 0.95)) continue;
    } else if (text) {
      const hay = [l.ref_code, l.locality, l.building, l.city, TYPES[l.property_type], l.bhk && l.bhk + " bhk", l.deal_type, l.facing, l.furnishing, l.notes, ...amenityList(l), ...approvalList(l), l.possession === "ready" ? "ready to move" : l.possession, team && l.owner_name, team && l.owner_phone].filter(Boolean).join(" ").toLowerCase();
      const words = text.toLowerCase().split(/\s+/).filter(w => w.length > 1);
      if (!words.every(w => hay.includes(w) || hay.split(/\s+/).some(h => h.length > 3 && snapLocality(w, [h])))) continue;
    }
    out.push({ l, badge });
  }
  return out;
}
function describeQuery(q) {
  if (!q) return "";
  const p = [];
  if (q.bhk) p.push(q.bhk + " BHK"); if (q.property_type) p.push(TYPES[q.property_type]); if (q.deal_type) p.push("for " + q.deal_type);
  if (q.localities?.length) p.push("in " + q.localities.join(" / "));
  if (q.min_price && q.max_price) p.push(`${money(q.min_price)}–${money(q.max_price)}`); else if (q.max_price) p.push("up to " + money(q.max_price)); else if (q.min_price) p.push("from " + money(q.min_price));
  if (q.min_size) p.push(q.min_size + "+ sq ft"); if (q.max_size) p.push("≤ " + q.max_size + " sq ft"); if (q.furnishing) p.push(q.furnishing);
  return p.join(" · ");
}

function card(l, badge, team) {
  const real = l.photos?.length;
  const img = `style="background-image:url('${esc(real ? photoUrl(l.photos[0]) : illusFor(l))}')"`;
  const priceLine = team && l.closing_price && l.closing_price !== l.asking_price
    ? `${money(l.asking_price, l.deal_type)} <small>closes ${money(l.closing_price, l.deal_type)}</small>` : money(l.asking_price, l.deal_type);
  const size = [l.size_sqft ? `${Math.round(l.size_sqft)} sq ft` : "", perSqft(l)].filter(Boolean).join(" · ");
  return `<div class="item" data-id="${l.id}"><div class="ph" ${img}>${real ? "" : `<span class="rep">Illustration</span>`}</div><div class="bd">
    <div class="price">${priceLine}</div>

  </div></div>`;

// Reads a price input. Lakh fields accept "125" (lakh), "1.25cr", "1 crore 25 lakh", or a full rupee amount like 12500000.
function priceValue(inp) {

async function uploadPhoto(id, file) {
  const blob = await shrink(file);
  const path = `${id}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg", upsert: false });
  if (error) throw error; return path;
}
function shrink(file) {
  return new Promise(res => {
    const img = new Image(); img.onload = () => {
      const m = 1600, k = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => res(b || file), "image/jpeg", 0.82);
    }; img.onerror = () => res(file); img.src = URL.createObjectURL(file);
  });
}

const OPEN_LEAD = ["new", "contacted", "site_visit", "negotiating"];
function leadMatches(lead) {
  return S.listings.map(l => ({ l, m: matchLead(lead, l) })).filter(x => x.m && x.m.score >= 50).sort((a, b) => b.m.score - a.m.score);
}
function leadsFor(listing) {
  return S.leads.filter(ld => OPEN_LEAD.includes(ld.status)).map(ld => ({ ld, m: matchLead(ld, listing) })).filter(x => x.m && x.m.score >= 50).sort((a, b) => b.m.score - a.m.score);
}
function scoreTag(n) { return `<span class="score ${n < 70 ? "mid" : ""}">${n}%</span>`; }
function describeLead(ld) {
  const p = [];
  if (ld.bhk_min || ld.bhk_max) p.push(ld.bhk_min && ld.bhk_max && ld.bhk_min !== ld.bhk_max ? `${ld.bhk_min}–${ld.bhk_max} BHK` : `${ld.bhk_min || ld.bhk_max} BHK`);
  if (ld.property_types?.length && ld.property_types.length < 4) p.push(ld.property_types.map(t => TYPES[t]).join("/"));
  p.push(ld.deal_type === "rent" ? "to rent" : "to buy");
  if (ld.localities?.length) p.push("in " + ld.localities.join(", "));
  if (ld.budget_min && ld.budget_max) p.push(`${money(ld.budget_min, ld.deal_type)}–${money(ld.budget_max, ld.deal_type)}`);
  else if (ld.budget_max) p.push("up to " + money(ld.budget_max, ld.deal_type));
  if (ld.size_min) p.push(ld.size_min + "+ sq ft");
  if (ld.furnishing) p.push(ld.furnishing);
  return p.join(" · ");
}

    $("#lparse").disabled = false; $("#lparse").textContent = "Fill the lead form";
    renderLeadForm($("#lform"), S.leadDraft, true);
  }
  if (d) renderLeadForm($("#lform"), d, true);
  document.querySelectorAll("[data-lf]").forEach(b => b.onclick = () => { S.leadFilter = b.dataset.lf; render(); });
  const rows = S.leads.filter(x => S.leadFilter === "all" ? true : S.leadFilter === "open" ? OPEN_LEAD.includes(x.status) : x.status === S.leadFilter);
  $("#llist").innerHTML = rows.length ? rows.map(ld => {
    const ms = leadMatches(ld);
    return `<div class="card lead" data-id="${ld.id}"><div class="row"><b class="grow">${esc(ld.name || "Unnamed lead")}</b><span class="tag">${LEAD_STATUSES[ld.status]}</span></div>
      <div class="meta">${esc(describeLead(ld))}</div>
      <div style="margin-top:6px">${ms.length ? `<span class="tag match">${ms.length} matching propert${ms.length > 1 ? "ies" : "y"}</span>${ms[0] ? `<span class="meta">best: ${esc(title(ms[0].l))}${ms[0].l.locality ? ", " + esc(ms[0].l.locality) : ""} (${ms[0].m.score}%)</span>` : ""}` : `<span class="meta">No matches in inventory yet</span>`}</div></div>`;
  }).join("") : `<div class="empty">${S.leads.length ? "No leads in this view." : "No leads yet. Record your first enquiry above."}</div>`;
  document.querySelectorAll(".lead").forEach(c => c.onclick = () => openLead(c.dataset.id));
}

function budgetField(k, lab, v, deal) {
  const rent = deal === "rent";
  return `<div><label>${lab} (${rent ? "₹ / month" : "₹ lakh · 1 Cr = 100"})</label><input name="${k}" type="text" inputmode="decimal" data-unit="${rent ? "rupee" : "lakh"}" value="${esc(rent ? (v ?? "") : lakhs(v))}"></div>`;
}
function renderLeadForm(el, d, isNew) {
  const deal = d.deal_type || "sale";
  const types = d.property_types || [];
  el.innerHTML = `<div class="card"><h3>${isNew ? "Check & save lead" : "Edit lead"}</h3>
   ${isNew ? `<div class="understood">Understood: ${esc(d.name || "New lead")} — ${esc(describeLead(d))}</div>` : ""}
   <form id="ldf" class="grid">
    ${field("name", "Customer name", d.name)}
    ${field("phone", "Phone", d.phone, "tel")}
    ${field("deal_type", "Wants to", deal, null, [["sale", "Buy"], ["rent", "Rent"]])}
    ${field("status", "Status", d.status || "new", null, Object.entries(LEAD_STATUSES))}
    <div class="full"><label>Property types (leave all unticked for any)</label><div class="typechips">${Object.entries(TYPES).map(([k, t]) => `<label><input type="checkbox" name="pt" value="${k}" ${types.includes(k) ? "checked" : ""}>${t}</label>`).join("")}</div></div>
    ${field("bhk_min", "BHK from", d.bhk_min, "number")}
    ${field("bhk_max", "BHK to", d.bhk_max, "number")}
    <div class="full"><label>Preferred areas (comma separated)</label><input name="localities" list="locs2" value="${esc((d.localities || []).join(", "))}"><datalist id="locs2">${knownLocalities().sort().map(x => `<option value="${esc(x)}">`).join("")}</datalist></div>
    ${budgetField("budget_min", "Budget from", d.budget_min, deal)}
    ${budgetField("budget_max", "Budget up to", d.budget_max, deal)}
    ${field("size_min", "Min size (sq ft)", d.size_min, "number")}
    ${field("size_max", "Max size (sq ft)", d.size_max, "number")}
    ${field("furnishing", "Furnishing", d.furnishing || "", null, [["", "Any"], ["unfurnished", "Unfurnished"], ["semi-furnished", "Semi-furnished"], ["furnished", "Furnished"]])}
    <div class="full"><label>Notes</label><textarea name="notes" style="min-height:60px">${esc(d.notes || "")}</textarea></div>
    <div class="full row"><button class="btn grow" type="submit" id="lsv">${isNew ? "Save lead & find matches" : "Save changes"}</button>${isNew ? `<button class="btn sec" type="button" id="lcl">Clear</button>` : ""}</div>
   </form></div>`;
  const f = $("#ldf", el);
  f.querySelectorAll("[data-unit]").forEach(inp => { const hint = document.createElement("div"); hint.className = "pricehint"; inp.after(hint); const upd = () => { const v = priceValue(inp); hint.textContent = v ? "= " + money(v, inp.dataset.unit === "rupee" ? "rent" : null) : ""; }; inp.addEventListener("input", upd); upd(); });
  f.deal_type.onchange = () => { Object.assign(d, readLeadForm(f)); d.deal_type = f.deal_type.value; renderLeadForm(el, d, isNew); };
  if ($("#lcl", el)) $("#lcl", el).onclick = () => { S.leadDraft = null; render(); };
  f.onsubmit = async e => {
    e.preventDefault(); const btn = $("#lsv", el); btn.disabled = true; btn.textContent = "Saving…";
    try {
      const row = readLeadForm(f);
      let id = d.id;
      if (isNew) { row.transcript = d.transcript; const { data, error } = await sb.from("leads").insert(row).select().single(); if (error) throw error; id = data.id; }
      else { const { error } = await sb.from("leads").update(row).eq("id", id); if (error) throw error; }
      await loadLeads();
      if (isNew) { S.leadDraft = null; render(); }
      toast(isNew ? "Lead saved ✓" : "Updated ✓");
      openLead(id);
    } catch (err) { toast("Couldn't save: " + (err.message || err)); btn.disabled = false; btn.textContent = "Try again"; }
  };
}
function readLeadForm(f) {
  const g = n => f[n] ? f[n].value.trim() : "";
  const num = n => f[n].dataset.unit ? priceValue(f[n]) : (g(n) === "" || isNaN(parseFloat(g(n))) ? null : parseFloat(g(n)));
  const known = knownLocalities();
  const locs = g("localities").split(/[,\/]| or | and /i).map(x => x.trim()).filter(Boolean).map(x => snapLocality(x, known) || titleCase(x.toLowerCase()));
  return { name: g("name") || null, phone: g("phone") || null, deal_type: g("deal_type"), status: g("status"),
    property_types: [...f.querySelectorAll("[name=pt]:checked")].map(x => x.value), bhk_min: num("bhk_min"), bhk_max: num("bhk_max"),
    localities: [...new Set(locs)], budget_min: num("budget_min"), budget_max: num("budget_max"), size_min: num("size_min"), size_max: num("size_max"),
    furnishing: g("furnishing") || null, notes: g("notes") || null };
}

function openLead(id) {
  const ld = S.leads.find(x => x.id === id); if (!ld) return toast("Lead not found");
  const ms = leadMatches(ld);
  const tel = telLink(ld.phone);
  openModal(`<div class="row"><h2 class="grow" style="margin:0">${esc(ld.name || "Unnamed lead")}</h2><button class="btn sec sm" id="mx">Close</button></div>
    <div class="card" style="margin-top:12px"><div class="meta">${esc(describeLead(ld))}</div>
     ${ld.notes ? `<p style="margin:8px 0 0">${esc(ld.notes)}</p>` : ""}
     ${ld.transcript ? `<p class="meta" style="margin:8px 0 0">“${esc(ld.transcript)}”</p>` : ""}
     <div class="row" style="margin-top:10px">${tel ? `<a class="btn sm" href="${tel}">Call</a><a class="btn sm" href="${waLink(ld.phone, "Hi " + (ld.name || ""))}" target="_blank">WhatsApp</a>` : ""}
      <select id="lst" style="width:auto;flex:1">${Object.entries(LEAD_STATUSES).map(([k, v]) => `<option value="${k}" ${k === ld.status ? "selected" : ""}>${v}</option>`).join("")}</select></div></div>
    <div class="card"><h3>Matching properties (${ms.length})</h3>
     ${ms.length ? ms.slice(0, 20).map(({ l, m }) => `<div class="mrow">${scoreTag(m.score)}<div class="grow" data-open="${l.id}" style="cursor:pointer">
        <b>${esc(title(l))}</b> · ${money(l.asking_price, l.deal_type)}${l.closing_price && l.closing_price !== l.asking_price ? ` <span class="meta">(closes ${money(l.closing_price, l.deal_type)})</span>` : ""}
        <div class="meta">${esc([l.building, l.locality].filter(Boolean).join(", "))}${l.size_sqft ? " · " + Math.round(l.size_sqft) + " sq ft" : ""}</div>
        <div>${m.why.map(w => `<span class="tag ${w === "Other area" || w.includes("above") || w.includes("close)") ? "" : "match"}">${esc(w)}</span>`).join("")}</div></div>
        ${ld.phone ? `<a class="btn sm" href="${waLink(ld.phone, "Hi " + (ld.name || "") + ", this one fits what you're looking for:\n\n" + shareText(l))}" target="_blank">Send</a>` : ""}</div>`).join("")
      : `<div class="meta">Nothing in inventory fits yet. When you add a property that does, it will show up here and on that property.</div>`}
     ${ld.phone && ms.length > 1 ? `<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:10px" target="_blank" href="${waLink(ld.phone, "Hi " + (ld.name || "") + ", here are some properties that match your requirement:\n\n" + ms.slice(0, 5).map(({ l }) => shareText(l)).join("\n\n"))}">Send top ${Math.min(5, ms.length)} on WhatsApp</a>` : ""}
    </div>
    <div class="row"><button class="btn sec sm" id="led">Edit lead</button><button class="btn warn sm" id="ldl">Delete</button></div><div id="leditf"></div>`);
  $("#mx").onclick = closeModal;
  document.querySelectorAll("[data-open]").forEach(x => x.onclick = () => openListing(x.dataset.open, true));
  $("#lst").onchange = async e => { const { error } = await sb.from("leads").update({ status: e.target.value }).eq("id", ld.id); if (error) return toast(error.message); await loadLeads(); toast("Status: " + LEAD_STATUSES[e.target.value]); if (S.tab === "leads") render(); };
  $("#led").onclick = () => { renderLeadForm($("#leditf"), { ...ld }, false); $("#leditf").scrollIntoView({ behavior: "smooth" }); };
  $("#ldl").onclick = async () => { if (!confirm("Delete this lead?")) return; const { error } = await sb.from("leads").delete().eq("id", ld.id); if (error) return toast(error.message); await loadLeads(); closeModal(); render(); toast("Lead deleted"); };
}

// ---------- Auth ----------
function openLogin() {
  openModal(`<div class="row"><h2 class="grow" style="margin:0">Team login</h2><button class="btn sec sm" id="mx">Close</button></div>
   <form id="af" class="card" style="margin-top:12px"><div style="margin-bottom:10px"><label>Email</label><input name="email" type="email" autocomplete="email" required></div>
   <div style="margin-bottom:12px"><label>Password</label><input name="password" type="password" autocomplete="current-password" minlength="6" required></div>
   <div class="row"><button class="btn grow" name="in">Sign in</button><button class="btn sec grow" type="button" id="up">Create account</button></div>
   <p class="meta" id="am" style="margin-bottom:0">New teammate? Ask the owner to invite your email, then tap “Create account”.</p></form>`);
  $("#mx").onclick = closeModal;
  const f = $("#af");
  f.onsubmit = async e => { e.preventDefault(); const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value }); if (error) $("#am").textContent = error.message === "Email not confirmed" ? "Check your inbox for the confirmation email first." : error.message; else closeModal(); };
  $("#up").onclick = async () => {
    if (!f.reportValidity()) return;
    const { data, error } = await sb.auth.signUp({ email: f.email.value.trim(), password: f.password.value, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) { $("#am").textContent = error.message; return; }
    if (!data.session) $("#am").textContent = "Account created — confirm it from the email we just sent, then sign in."; else closeModal();
  };
}
$("#authBtn").onclick = () => { if (!S.session) return openLogin(); S.publicMode = !S.publicMode; (S.publicMode ? loadPublic() : loadListings()).then(render); };
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.query = ""; searchQ = null; render(); window.scrollTo(0, 0); });

// ---------- Data ----------
async function loadSettings() { const { data } = await sb.from("app_settings").select("*").eq("id", 1).maybeSingle(); S.settings = data || {}; }
async function loadPublic() { const { data } = await sb.rpc("public_listings"); S.publicListings = data || []; }
async function loadListings() { if (!S.role) return; const { data, error } = await sb.from("listings").select("*").order("created_at", { ascending: false }); if (!error) S.listings = data || []; }
async function loadLeads() { if (!S.role) return; const { data, error } = await sb.from("leads").select("*").order("created_at", { ascending: false }); if (!error) S.leads = data || []; }
async function loadRole() { if (!S.session) { S.role = null; return; } const { data } = await sb.rpc("join_team"); S.role = data || null; }

async function boot() {
  const hash = location.hash;
  S.publicMode = hash.startsWith("#/catalogue") || hash.startsWith("#/p/");
  const { data: { session } } = await sb.auth.getSession(); S.session = session;
  await Promise.all([loadSettings(), loadRole()]);
  if (S.role) { await Promise.all([loadListings(), loadLeads()]); if (S.listings.length && !S.publicMode) S.tab = "add"; }
  if (!S.role || S.publicMode) await loadPublic();
  render();
  const m = hash.match(/^#\/p\/([0-9a-f-]{36})/); if (m) { if (!S.publicListings.length) await loadPublic(); openListing(m[1], false); }
}
sb.auth.onAuthStateChange(async (ev, session) => {
  if (ev === "INITIAL_SESSION") return;
  S.session = session; await loadRole();
  if (S.role) { S.publicMode = false; await Promise.all([loadListings(), loadLeads()]); } else { await loadPublic(); }
  render();
});
boot();
</script>
</body>
</html>
